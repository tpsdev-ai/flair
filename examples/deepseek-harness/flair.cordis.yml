# Opt-in overlay wiring Flair into DeepSeek Harness via the first-party MCP
# bridge (@deepseek-ai/dsh-mcp-client). Shape verified against DSH master
# 2026-08-20. Replace <version> and <agent-id> before use — the literal
# placeholders fail loudly at npx, which is intended.
# Docs: docs/deepseek-harness.md   Apply: dsh web --patch "$PWD/<this file>"
- insert:
    - id: memory-flair
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: flair
        transport: stdio
        command: npx
        args: ['-y', '@tpsdev-ai/flair-mcp@<version>']
        env:
          FLAIR_AGENT_ID: <agent-id>
          FLAIR_URL: http://127.0.0.1:19926
