name: Release — pack once, stage from tarballs (OIDC) + GitHub release

# Tokenless release pipeline, triggered by pushing a vX.Y.Z tag. Authenticates to
# npm via OIDC trusted publishing (no NPM_TOKEN lives anywhere) and submits every
# workspace package to npm's STAGING area via `npm stage publish` rather than
# publishing live. A maintainer approves the staged tarballs on npmjs.com with 2FA
# to go live — that approval is the release gate (see docs/releasing.md).
#
# flair#1671 slice A1a ("pack once, stage from tarballs"). The build and the pack
# happen ONCE, in the `pack` job, which writes one tarball per publishable package
# plus a `manifest.json` binding every tarball's sha256 and a canonical
# package-set digest. The `stage-publish` job downloads that artifact BY ID,
# re-derives both digests from the bytes it received, and stages those exact
# tarballs — never a directory, so npm can never re-run `prepack` at stage time.
# Staging is credential-scoped (id-token: write) and runs no repository code.
#
# flair#1686 — every package stages with `--tag staged`, NEVER straight to
# `latest` (prereleases stage with `--tag next`). The staging tag is an IMMUTABLE
# property of the staged package (`npm help stage`): re-staging the same version
# under a different tag requires `npm stage reject` FIRST, so "re-cut, never
# refresh" is enforced by the tool, not just policy. After a maintainer approves,
# the version is public but NOT `latest`; the post-publish canary
# (.github/workflows/canary.yml) installs that exact version from the registry and
# boots it on ubuntu-latest + macos-latest. The canary is credential-less and
# `latest` is not a dist-tag this workflow can move (the OIDC identity is scoped
# to `npm stage publish` and has no dist-tag capability).
#
# A separate, INDEPENDENT job (github-release) cuts a GitHub release for the tag
# from a lede+links rendering of the matching CHANGELOG.md section (flair#1392).
# It does NOT depend on the npm staging approval — the GitHub release documents
# the tagged commit immediately on push. The deep record stays in CHANGELOG.md.
#
# Cut a release: after the `release: vX.Y.Z` PR merges to main, push the tag:
#   git tag v0.11.0 && git push origin v0.11.0
# The tag push triggers this workflow. (workflow_dispatch is a manual fallback.)
#
# One-time setup (npmjs.com, per package): add a Trusted Publisher pointing at
#   org=tpsdev-ai, repo=flair, workflow=release-publish.yml, environment=release
# and allow ONLY "npm stage publish". The `release` GitHub environment must permit
# `v*` tag deploys.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # Manual fallback. It takes NO inputs on purpose: the run must be dispatched
    # ON the v* tag ref, so the ref (and the tag's commit) is the only version
    # source. A dispatch on main cannot pack main's HEAD under a tag's version.

# Default to NOTHING. Every job below opts into exactly what it needs, so a
# future job cannot inherit a grant by accident.
permissions: {}

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  pack:
    name: Pack publishable packages
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout + git fetch for the version-sync check
      deployments: read    # read-only reservation fail-fast (pack never writes the marker)
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      package-set-digest: ${{ steps.pack.outputs.package-set-digest }}
      manifest-digest: ${{ steps.pack.outputs.manifest-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Resolve version
        # The TAG is the only version source. This asserts the run is on a
        # refs/tags/vX.Y.Z ref (both trigger paths: a tag push and a dispatch
        # made ON the tag), so VERSION, GITHUB_SHA and npm provenance all name
        # the tag's commit. A dispatch on main (or any other ref) fails here.
        id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::This workflow must run on a v* tag ref (got type '$REF_TYPE' for '$REF'). Dispatch it on the tag, not on a branch."
            exit 1
          fi
          if ! [[ "$REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?)$ ]]; then
            echo "::error::Ref '$REF' is not a refs/tags/vX.Y.Z tag."
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version from tag $REF: $VERSION"

      - name: Reservation preflight (read-only)
        # Invariant 8: an early, READ-ONLY fail-fast. pack never writes the
        # marker; stage-publish does, immediately before its first stage request.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          DEPLOYMENTS_FILE="$RUNNER_TEMP/release-attempts.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/deployments?environment=release-attempt&ref=v${VERSION}" > "$DEPLOYMENTS_FILE"
          COUNT="$(jq -s 'map(length) | add' "$DEPLOYMENTS_FILE")"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::version v${VERSION} is burned: a release-attempt deployment already exists for it; the next patch is the only path"
            exit 1
          fi
          echo "  ok no release-attempt record for v${VERSION}"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          # NO registry-url: it makes setup-node write an .npmrc with
          # _authToken=${NODE_AUTH_TOKEN} + always-auth, and with NODE_AUTH_TOKEN
          # unset npm tries the EMPTY token and fails E401 instead of falling
          # through to OIDC trusted publishing. OIDC needs no token config; npm
          # defaults to registry.npmjs.org.

      - name: First-publish preflight
        # flair#1674: the tag-triggered path is the NORMAL release path — and the
        # one the @tpsdev-ai/harper reprint rode. Hard-stop an unapproved
        # first-publish before anything is built. Moved here from the old staging
        # job in slice A1a: this job runs candidate code by design, and it still
        # precedes every tarball and every stage request.
        run: node scripts/first-publish-check.mjs

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: "1.3.10"

      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Cache bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-
      - name: Install (sfw — retry on intermittent Socket-firewall hang, ops-fumh)
        run: |
          for attempt in 1 2 3; do
            echo "::group::sfw bun install (attempt $attempt/3)"
            if timeout 300 sfw bun install --frozen-lockfile; then echo "::endgroup::"; exit 0; fi
            echo "::endgroup::"
            echo "sfw install attempt $attempt failed or timed out (5m) — the sfw hang is intermittent; retrying in 10s"
            sleep 10
          done
          echo "sfw bun install failed after 3 attempts"; exit 1

      - name: Verify all workspace versions match the tag
        # All values flow through env, never ${{ }} interpolation inside the
        # script body — keeps the resolved version out of the shell parser.
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          PKG_JSONS=(
            package.json
            packages/flair-client/package.json
            packages/flair-tool-descriptors/package.json
            packages/flair-mcp/package.json
            packages/openclaw-flair/package.json
            packages/pi-flair/package.json
            packages/n8n-nodes-flair/package.json
            packages/langgraph-flair/package.json
            packages/adk-flair-js/package.json
            packages/flair-bench/package.json
          )
          for pj in "${PKG_JSONS[@]}"; do
            name="$(node -p "require('./$pj').name")"
            pv="$(node -p "require('./$pj').version")"
            if [ "$pv" != "$VERSION" ]; then
              echo "::error::$name is at $pv, expected $VERSION (tag v$VERSION). Tag a merged release commit."
              exit 1
            fi
            echo "  ok $name @ $pv"
          done

      - name: Verify version declarations outside package.json match the tag
        # The loop above reads package.json files only. The version is also
        # declared in source -- packages/flair-bench/src/version.ts holds it as
        # a TOOL_VERSION constant -- and nothing here could see that.
        #
        # This is the LAST gate before npm staging. Everything upstream of a tag
        # is recoverable; a staged tarball and a pushed tag are not, and the only
        # thing after this is a human 2FA approval that cannot be expected to
        # catch a wrong version constant. Relying on the release PR's CI to have
        # caught it assumes no one ever merges past a red check, which is not an
        # assumption this repo has earned.
        #
        # Same script release.sh preflights with, deliberately: a fourth call
        # site is correct, a fourth implementation would be the bug this whole
        # change exists to prevent. Needs only node + the git checkout, both
        # already set up above.
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: node scripts/check-version-sync.mjs "$VERSION"

      - name: Build
        # Every publishable package is built HERE, in dependency order, because
        # staging no longer runs from a directory: there is no `prepack`/
        # `prepublishOnly` hook to fall back on at stage time. flair-client first
        # (the others import it); the root build vendors the tool descriptors.
        run: |
          set -euo pipefail
          npm run build && npm run build:cli
          (cd packages/flair-client && npm run build)
          (cd packages/flair-tool-descriptors && npm run build)
          (cd packages/flair-mcp && npm run build)
          (cd packages/langgraph-flair && npm run build)
          (cd packages/n8n-nodes-flair && npm run build)
          (cd packages/openclaw-flair && npm run build)
          (cd packages/pi-flair && npm run build)
          (cd packages/adk-flair-js && npm run build)
          (cd packages/flair-bench && npm run build)

      - name: Pack publishable packages and write the release manifest
        # One `npm pack --ignore-scripts` per package, into one output directory,
        # plus the exact-pin invariant and the manifest (name@version sha256,
        # package-set digest). `--dirs` is the dependency-ordered publish set; the
        # script refuses unless it names exactly lockstepPackages().
        id: pack
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PACK_OUT: ${{ runner.temp }}/packed
        run: |
          set -euo pipefail
          DIRS=(
            packages/flair-client
            packages/flair-mcp
            .
            packages/openclaw-flair
            packages/pi-flair
            packages/n8n-nodes-flair
            packages/langgraph-flair
            packages/adk-flair-js
            packages/flair-bench
          )
          node scripts/ci/release-pack.mjs --out "$PACK_OUT" --version "$VERSION" --dirs "${DIRS[@]}"

      - name: Upload packed tarballs
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/packed
          if-no-files-found: error
          retention-days: 7

  stage-publish:
    name: Stage-publish all packages
    needs: pack
    runs-on: ubuntu-latest
    # `release` is an OIDC-scoping environment, NOT an approval gate: it pins the
    # trusted-publisher trust to this environment. The human gate is the npm
    # staging approval (2FA), not a GitHub reviewer.
    environment: release
    permissions:
      id-token: write      # mint the short-lived OIDC token for npm trusted publishing
      contents: read       # checkout, for the ancestry + recency checks
      deployments: write   # write the release-attempt reservation marker (this job runs no candidate code)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Verify tagged commit is on main and the workflow file is current
        # A tag can point at any commit; require it to be merged to main so a tag
        # can never ship un-reviewed code past the npm staging gate. The fetch is
        # scoped to THIS step (the only git fetch in the job).
        #
        # Machinery recency (defence in depth). Both trigger paths may run the
        # workflow file from the TAG commit, and the trusted-publisher pin names
        # the workflow FILE, not its content. A tag on a pre-hardening commit
        # would run that commit's workflow (old permissions, no reservation, no
        # gate) under the same OIDC identity. The real control is a v* tag
        # ruleset restricting tag creation to maintainers (a repository setting);
        # this inline guard can only fire when GitHub loads the definition from
        # the default branch, so it is defence in depth, not the boundary.
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit ${GITHUB_SHA} is not an ancestor of origin/main. Tag a merged release commit."
            exit 1
          fi
          if ! git diff --quiet origin/main -- .github/workflows/release-publish.yml; then
            echo "::error::.github/workflows/release-publish.yml at the tag differs from origin/main; refusing to stage from stale release machinery."
            exit 1
          fi
          echo "  ok ${GITHUB_SHA} is on main and the workflow file matches origin/main"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          # NO registry-url — see the note in the pack job.

      - name: Upgrade npm to a staging-capable version
        # OIDC trusted publishing needs npm >= 11.5.1; `npm stage` needs >= 11.15.0.
        # Node 22 ships npm 10.x, so upgrade explicitly, to an EXACT version (a
        # range would fetch a different npm between the pin and the run). This is
        # npm's own package, not candidate code. The userconfig is created in the
        # job and passed explicitly so a candidate workspace `.npmrc` cannot
        # redirect the registry out from under the OIDC exchange.
        env:
          ART_DIR: ${{ runner.temp }}/stage
          NPM_USERCONFIG: ${{ runner.temp }}/npm-userconfig
        run: |
          set -euo pipefail
          mkdir -p "$ART_DIR"
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_USERCONFIG"
          cd "$ART_DIR"
          npm install -g npm@11.20.0 --userconfig "$NPM_USERCONFIG"
          npm --version --userconfig "$NPM_USERCONFIG"

      - name: Download packed tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact-id }}
          # merge-multiple: true lays the artifact's files FLAT in `path`; without
          # it, v4 nests them under a directory named after the artifact and the
          # stage shell would not find manifest.json.
          merge-multiple: true
          path: ${{ runner.temp }}/stage

      - name: Stage-publish all packages
        # The digest shell is INLINE: no repository script runs in this job (a
        # script from the checkout is candidate code at that tag). Every npm
        # command runs from $ART_DIR with the throwaway --userconfig, so a
        # workspace .npmrc has no effect. Each tarball is re-hashed immediately
        # before its own `npm stage publish`, and the artifact is re-hashed as a
        # set before anything is staged; a mismatch before the first publish is a
        # pre-stage failure, one after it is INCOMPLETE.
        env:
          ART_DIR: ${{ runner.temp }}/stage
          NPM_USERCONFIG: ${{ runner.temp }}/npm-userconfig
          WORK_DIR: ${{ runner.temp }}/stage-work
          GH_TOKEN: ${{ github.token }}
          PACK_PACKAGE_SET_DIGEST: ${{ needs.pack.outputs.package-set-digest }}
          PACK_MANIFEST_DIGEST: ${{ needs.pack.outputs.manifest-digest }}
        run: |
          set -euo pipefail
          cd "$ART_DIR"
          # Scratch files live OUTSIDE the artifact directory: the exact-set check
          # below compares the artifact's contents, so a helper file written into
          # it would read as an unexpected entry.
          mkdir -p "$WORK_DIR"
          if [ ! -f manifest.json ]; then
            echo "::error::release artifact has no manifest.json"; exit 1
          fi

          LIST="$WORK_DIR/release-packages.tsv"
          jq -r '.packages[] | "\(.name)\t\(.version)\t\(.basename)\t\(.sha256)"' manifest.json > "$LIST"

          # Expected: the manifest plus the tarballs it names. Every basename must
          # be a plain filename (no separator, no path escape).
          EXPECTED="$WORK_DIR/release-expected.txt"
          : > "$EXPECTED"
          printf 'manifest.json\n' >> "$EXPECTED"
          while IFS=$'\t' read -r name version basename sha; do
            if [ -z "$basename" ]; then continue; fi
            if [ "$basename" != "${basename##*/}" ] || [ "$basename" != "${basename//..}" ]; then
              echo "::error::manifest names an unsafe basename: $basename"; exit 1
            fi
            printf '%s\n' "$basename" >> "$EXPECTED"
          done < "$LIST"

          # Enumerate EVERY directory entry regardless of name. A glob cannot see
          # a two-dot name (..foo) and the -e test skips a DANGLING symlink, so
          # both would slip past the set compare; find(1) lists them. Reject any
          # symlink (dangling or not) and any directory, then compare the sorted
          # listing to the manifest set.
          FOUND="$WORK_DIR/release-found.txt"
          find . -mindepth 1 -maxdepth 1 -printf '%P\n' > "$FOUND"
          while IFS= read -r entry; do
            if [ -z "$entry" ]; then continue; fi
            if [ -L "$entry" ]; then
              echo "::error::release artifact contains a symlink: $entry"; exit 1
            fi
            if [ -d "$entry" ]; then
              echo "::error::release artifact contains a directory: $entry"; exit 1
            fi
          done < "$FOUND"
          LC_ALL=C sort -o "$EXPECTED" "$EXPECTED"
          LC_ALL=C sort -o "$FOUND" "$FOUND"
          if ! cmp -s "$EXPECTED" "$FOUND"; then
            echo "::error::release artifact does not hold exactly manifest.json and the tarballs it lists; unexpected or missing entries"; exit 1
          fi

          # Manifest digest: the manifest is byte-identical to the packed one.
          MANIFEST_DIGEST="$(sha256sum manifest.json)"; MANIFEST_DIGEST="${MANIFEST_DIGEST%% *}"
          if [ "$MANIFEST_DIGEST" != "$PACK_MANIFEST_DIGEST" ]; then
            echo "::error::manifest digest $MANIFEST_DIGEST differs from pack's $PACK_MANIFEST_DIGEST"; exit 1
          fi

          # Package-set digest: recompute the canonical sorted list from the files
          # and require it to agree with BOTH the manifest's own field AND pack's
          # job output, before the first request.
          MANIFEST_SET_DIGEST="$(jq -r '.packageSetDigest' manifest.json)"
          CANON="$WORK_DIR/release-canonical.txt"
          : > "$CANON"
          while IFS=$'\t' read -r name version basename sha; do
            if [ -z "$basename" ]; then continue; fi
            actual="$(sha256sum "$basename")"; actual="${actual%% *}"
            if [ "$actual" != "$sha" ]; then
              echo "::error::pre-stage failure: $basename is $actual, the manifest says $sha; nothing staged"; exit 1
            fi
            printf '%s@%s %s\n' "$name" "$version" "$actual" >> "$CANON"
          done < "$LIST"
          LC_ALL=C sort -o "$CANON" "$CANON"
          PACKAGE_SET_DIGEST="$(sha256sum "$CANON")"; PACKAGE_SET_DIGEST="${PACKAGE_SET_DIGEST%% *}"
          if [ "$PACKAGE_SET_DIGEST" != "$PACK_PACKAGE_SET_DIGEST" ]; then
            echo "::error::package-set digest $PACKAGE_SET_DIGEST differs from pack's $PACK_PACKAGE_SET_DIGEST"; exit 1
          fi
          if [ "$PACKAGE_SET_DIGEST" != "$MANIFEST_SET_DIGEST" ]; then
            echo "::error::package-set digest $PACKAGE_SET_DIGEST differs from the manifest field $MANIFEST_SET_DIGEST"; exit 1
          fi

          # Tarballs are read-only in this job: nothing rewrites them before staging.
          chmod a-w ./*.tgz

          VERSION_TOP="$(jq -r '.version' manifest.json)"

          # ── One attempt per version (Invariant 8). The reservation is an
          # explicit marker this job writes ITSELF, so a failed-jobs re-run (which
          # re-runs this job) sees attempt 1's marker. The GET is paginated; ANY
          # record means the version is burned. A non-2xx GET, or a failed/non-2xx
          # POST, aborts BEFORE any stage request (no || true). The same token can
          # deactivate and delete the marker, so the burn is enforced by this job's
          # allowlist and branch protection, not by GitHub. This runs after the npm
          # self-upgrade and the pre-stage digest assertions, before the first
          # stage request.
          DEPLOYMENTS_FILE="$WORK_DIR/release-attempts.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/deployments?environment=release-attempt&ref=v${VERSION_TOP}" > "$DEPLOYMENTS_FILE"
          EXISTING="$(jq -s 'map(length) | add' "$DEPLOYMENTS_FILE")"
          if [ "$EXISTING" -gt 0 ]; then
            echo "::error::version v${VERSION_TOP} is burned: a release-attempt deployment already exists for it; the next patch is the only path"
            exit 1
          fi
          MARKER_BODY="$(jq -n --arg ref "v${VERSION_TOP}" '{ref:$ref, environment:"release-attempt", task:"stage-attempt", auto_merge:false, required_contexts:[]}')"
          if ! printf '%s' "$MARKER_BODY" | gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments" --input - > /dev/null; then
            echo "::error::could not write the release-attempt marker for v${VERSION_TOP}; nothing was staged"
            exit 1
          fi
          echo "  reserved v${VERSION_TOP} (release-attempt marker written)"

          # Stage each tarball, re-hashing it immediately before its own request.
          PUBLISHED=0
          STAGED=""
          FAILURE=""
          FAILED_PKG=""
          REASON=""
          while IFS=$'\t' read -r name version basename sha; do
            if [ -z "$basename" ]; then continue; fi
            actual="$(sha256sum "$basename")"; actual="${actual%% *}"
            if [ "$actual" != "$sha" ]; then
              FAILED_PKG="$name"; REASON="failed its re-hash"
              if [ "$PUBLISHED" -gt 0 ]; then FAILURE="incomplete"; else FAILURE="prestage"; fi
              break
            fi
            tag=staged
            if [ "$version" != "${version%%-*}" ]; then tag=next; fi
            if npm stage publish "$ART_DIR/$basename" --tag "$tag" --ignore-scripts --userconfig "$NPM_USERCONFIG"; then
              PUBLISHED=$((PUBLISHED + 1))
              STAGED="$STAGED$name@$version"$'\n'
            else
              FAILED_PKG="$name"; REASON="failed its npm stage publish request"
              FAILURE="incomplete"
              break
            fi
          done < "$LIST"

          if [ "$FAILURE" = "prestage" ]; then
            echo "::error::pre-stage failure: $FAILED_PKG $REASON before any publish; nothing staged"
            exit 1
          fi

          if [ "$FAILURE" = "incomplete" ]; then
            # A request was sent, so its outcome is unknown: this is INCOMPLETE,
            # never "nothing staged". List the digest evidence and the exact
            # package sets so a maintainer can reconcile on npmjs.com.
            NOT_ATTEMPTED=""
            seen=0
            while IFS=$'\t' read -r name version basename sha; do
              if [ "$seen" -eq 1 ]; then NOT_ATTEMPTED="$NOT_ATTEMPTED$name@$version"$'\n'; fi
              if [ "$name" = "$FAILED_PKG" ]; then seen=1; fi
            done < "$LIST"
            echo "::error::INCOMPLETE: APPROVE NOTHING - $FAILED_PKG $REASON; a request that was sent may have staged"
            {
              echo "## INCOMPLETE: APPROVE NOTHING"
              echo ""
              echo "A stage request was sent and its outcome is not confirmed. Inspect each entry on npmjs.com before approving ANY; do not approve a partial set."
              echo ""
              echo "package-set digest: $PACKAGE_SET_DIGEST"
              echo "manifest digest: $MANIFEST_DIGEST"
              echo ""
              echo "confirmed staged so far:"
              if [ -n "$STAGED" ]; then echo "$STAGED"; else echo "(none confirmed)"; fi
              echo ""
              echo "failed or unknown: $FAILED_PKG"
              echo ""
              echo "not attempted:"
              if [ -n "$NOT_ATTEMPTED" ]; then echo "$NOT_ATTEMPTED"; else echo "(none)"; fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          TAG_LINE=staged
          if [ "$VERSION_TOP" != "${VERSION_TOP%%-*}" ]; then TAG_LINE=next; fi
          {
            echo "### v$VERSION_TOP staged for release (tag: $TAG_LINE)"
            echo ""
            echo "$PUBLISHED package(s) submitted to npm **staging** with provenance under the **$TAG_LINE** tag. They are **not live at latest** yet."
            echo ""
            echo "flair tarball sha256 (the canary's expected_sha256):"
            while IFS=$'\t' read -r name version basename sha; do
              if [ "$name" = "@tpsdev-ai/flair" ]; then echo "  $sha"; break; fi
            done < "$LIST"
            echo ""
            echo "**To release:** open npmjs.com -> Settings -> Staged Packages, review each tarball, and approve with 2FA. Then dispatch the post-publish canary (Actions -> \"Post-publish canary — install + boot a published version\") with this version and the flair tarball's sha256. Only a canary PASS prints the sha256-bound promote command; run that line to move latest. On a canary FAIL, run the emitted npm deprecate line and re-cut the next patch — a staged tag is immutable, so a version is never refreshed in place."
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Cut GitHub release from CHANGELOG lede
    runs-on: ubuntu-latest
    # Independent of stage-publish on purpose: the GitHub release documents the
    # tagged commit and can be cut immediately on tag push. It does NOT wait on
    # the npm staging 2FA approval (a manual external gate) — that gate governs
    # what goes LIVE on npm, not whether the tag is recorded on GitHub.
    if: github.event_name == 'push'
    permissions:
      contents: write   # create/edit the GitHub release for the tag
    steps:
      - name: Resolve version
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # tag push: github.ref_name is the tag (vX.Y.Z)
          VERSION="${REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION'. Expected semver (e.g. 0.11.0 or 1.0.0-rc.1)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Render release notes from CHANGELOG
        # The renderer keeps each entry's bold lede, up to three issue links, and
        # any `> **Heads-up:**` operator lines — not the full CHANGELOG body.
        # Version flows through env, never ${{ }} interpolation in the script
        # body, and the notes are captured to a file (never re-emitted into a
        # shell string) so neither the tag nor the CHANGELOG text can be parsed
        # as shell. Fails loudly (non-zero) if the section is missing or empty.
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/changelog-release-notes.mjs "$VERSION" CHANGELOG.md > release-notes.md
          echo "Rendered $(wc -l < release-notes.md) lines / $(wc -w < release-notes.md) words for v$VERSION"

      - name: Create or update GitHub release
        # Idempotent: if a release for the tag already exists (re-run, or the
        # manually-cut v0.16.0), update it in place instead of failing. The notes
        # body is passed via --notes-file (a file on disk), and the tag/title via
        # env-expanded argv — content is never interpolated into the command text.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — updating notes."
            gh release edit "$TAG" \
              --title "v$VERSION" \
              --notes-file release-notes.md
          else
            echo "Creating release $TAG."
            gh release create "$TAG" \
              --title "v$VERSION" \
              --notes-file release-notes.md \
              --verify-tag
          fi
          echo "Release URL: $(gh release view "$TAG" --json url --jq .url)"
