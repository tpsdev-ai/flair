name: Post-publish canary — install + boot a published version

# flair#1686. The 0.54.1 release was published with every CI light green and could
# not start its engine on a fresh `npm i -g` (flair#1683); `latest` pointed at it
# for ~1.5 h until a human moved the tag by hand. Nothing between publish and
# announce installed the published artifact the way a user does and booted it.
#
# This is that last line. It is dispatched by whoever approved the staged package
# on npmjs.com, immediately after the approval (npm exposes no approval webhook,
# and polling a human action in CI is waste). `release-publish.yml` stages with
# `--tag staged`, so between approval and promote the version is public but NOT
# `latest` — the window this canary uses.
#
# It runs on a clean ubuntu-latest AND macos-latest, credential-less: no npm
# token, no OIDC (`id-token: write` is deliberately absent — the publish
# identity must never be in a job that installs and runs third-party code), and
# lifecycle scripts are ON exactly as a user's install runs them.
#
# THE CONTRACT
#   - The version is installed by EXACT version, never a dist-tag; the canary
#     must install the bytes it was dispatched for.
#   - The published tarball's sha256 must equal the `expected_sha256` recorded
#     for the staged tarball. A mismatch is a stop (npm versions are immutable, so
#     a matching sha is what makes the later promote race-free). npm exposes no
#     sha256 directly — `dist.shasum` is SHA-1 — so
#     `scripts/ci/registry-tarball-sha256.mjs` downloads the tarball and hashes it.
#     flair#1781: EVERY lockstep package is hashed (each promote line binds its
#     own package's sha), and `@tpsdev-ai/flair` is also checked against
#     `expected_sha256`.
#    - A1c of #1671: the promote is bound to a SINGLE package-set digest — the
#     sha256 over the canonical sorted list of `<name>@<version> <sha256>` lines,
#     one per lockstep package, exactly as the release run's pack job (A1a, #1877)
#     records it. The canary re-derives that digest from the tarballs it just
#     verified and requires it to equal the dispatched `package_set_digest` BEFORE
#     any verdict; a mismatch (or an unmeasurable digest) is a FAIL, and a
#     SemVer prerelease is never promoted (it lives on `next`), so PASS prints
#     no promote block for one.
#   - The four install-tree assertions and the boot contract live in shared
#     scripts (`scripts/check-global-install-lockfile.mjs --registry-version` and
#     `scripts/ci/check-instance-boot.sh`) — the PR install-weight lane and the
#     rockit deploy ritual call the same definitions.
#   - The plugin canary (`scripts/ci/check-plugin-canary.mjs`, flair#1338)
#     then installs published `@tpsdev-ai/flair-mcp` / `flair-client` at the
#     same exact version, writes the documented host config, and asserts a
#     real tools/call round-trip against the canary-booted instance. That is
#     the hosted adapter path (HTTP + Ed25519), not an in-process import of
#     our workspace sources.
#   - No `continue-on-error`. An unmeasurable canary (registry lag, runner
#     outage, missing tree, host unreachable) is a FAIL, never a skip.
#
# WHAT IT EMITS
#   PASS prints the complete, package-set-digest-bound promote block — one
#   `npm dist-tag add` per lockstep package (all or none; `@tpsdev-ai/flair`
#   LAST). FAIL prints one `npm deprecate` line per package. The human's job is
#   approve-on-npmjs, then paste the block — a stale PASS, a re-cut version, a
#   different package set, or a paste-from-FAIL aborts at the digest preflight
#   before `latest` can move. A SemVer prerelease is never promoted, so a
#   prerelease PASS prints a note and NO promote block.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to canary, exact (e.g. 0.54.2). Must be 2FA-approved and public."
        required: true
        type: string
      expected_sha256:
        description: "sha256 of the published @tpsdev-ai/flair@<version> tarball (64 hex); the canary downloads and verifies it."
        required: true
        type: string
      package_set_digest:
        description: "the package-set digest printed by the release run's pack summary (64 hex); the canary re-derives the SAME digest from the tarballs it verified and requires equality before any verdict (A1c of #1671)."
        required: true
        type: string

# Credential-less by construction: no top-level token, no OIDC. The job grants
# only `contents: read` for checkout (with credentials not persisted).
permissions: {}

concurrency:
  group: canary-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  canary:
    name: canary ${{ inputs.version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          # NO registry-url — that writes an .npmrc pointing at
          # _authToken=${NODE_AUTH_TOKEN} and a job with no token fails E401.
          # This job is credential-less and reads the public registry only.

      - name: Pin npm
        # flair#1686 A4d: the install-tree floor is npm-major-specific (543 added
        # on npm 10.9.4, 560 on npm 11). A PASS must mean the number it printed,
        # so the runner's npm is pinned to one exact version. Never `@latest`.
        run: |
          set -euo pipefail
          npm install -g npm@11.19.1
          echo "npm $(npm --version)"

      - name: Verify the published tarballs' sha256 (all lockstep packages)
        id: sha
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED: ${{ inputs.expected_sha256 }}
          PKG_SET_DIGEST: ${{ inputs.package_set_digest }}
        run: |
          set -uo pipefail
          mkdir -p canary-logs
          if ! printf '%s' "$EXPECTED" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::expected_sha256 is not a 64-char hex sha256: '$EXPECTED'"
            exit 1
          fi
          # flair#1781: the promote is lockstep, so hash EVERY lockstep package's
          # published tarball, not only @tpsdev-ai/flair — each promote line binds
          # its own package's sha. npm exposes no sha256 (dist.shasum is SHA-1,
          # dist.integrity is SHA-512), so this downloads each published tarball
          # and hashes it. @tpsdev-ai/flair is additionally checked against the
          # dispatched expected_sha256.
          : > canary-logs/sha256.err
          : > canary-logs/lockstep-sha256.txt
          missing=0
          while read -r pkg; do
            [ -n "$pkg" ] || continue
            if ! sha="$(node scripts/ci/registry-tarball-sha256.mjs "$VERSION" "$pkg" 2>> canary-logs/sha256.err)"; then
              echo "::error::could not hash ${pkg}@${VERSION} — is it approved and public? (unmeasurable is FAIL)"
              missing=1
              continue
            fi
            # flair#1856 R2: a NON-ZERO EXIT is not the only way to fail. The
            # hasher can exit 0 with NO output — a symlinked entry point used to
            # skip its main() and print nothing. An exit code alone cannot tell
            # "hashed" from "did not hash", so require the sha ITSELF to be 64
            # hex chars. Anything else (empty included) is unmeasurable, and an
                 # unmeasurable tarball is FAIL. Without this an empty sha would
                 # change the re-derived digest, and the line-count check below counts
                 # lines, not values. `expected_count` is 0 only if the derivation failed.
            if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::could not hash ${pkg}@${VERSION} — is it approved and public? (unmeasurable is FAIL)"
              missing=1
              continue
            fi
            echo "${pkg}=${sha}" >> canary-logs/lockstep-sha256.txt
            if [ "$pkg" = "@tpsdev-ai/flair" ]; then
              echo "expected sha256: ${EXPECTED}"
              echo "registry sha256 (@tpsdev-ai/flair): ${sha}"
              if [ "$sha" != "$EXPECTED" ]; then
                echo "::error::sha256 mismatch for @tpsdev-ai/flair — the published bytes are not the bytes the canary was dispatched for; do not promote"
                missing=1
              fi
            fi
          done < <(node scripts/ci/lockstep-packages.mjs)
          tail -n 20 canary-logs/sha256.err || true
          # An empty or short loop (the derivation failed) must not read as a pass.
          expected_count="$(node scripts/ci/lockstep-packages.mjs | wc -l | tr -d ' ')"
          got_count="$(wc -l < canary-logs/lockstep-sha256.txt | tr -d ' ')"
          if [ "$got_count" != "$expected_count" ] || [ "$expected_count" -eq 0 ]; then
            echo "::error::hashed ${got_count}/${expected_count} lockstep tarballs — refusing to promote a partial set"
            exit 1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::one or more lockstep tarballs could not be hashed or did not match"
            exit 1
          fi
          echo "all ${got_count} lockstep tarball sha256 values verified"
          # Package-set digest (A1c of #1671): re-derive the canonical digest from
          # the per-package shas just verified and require it to equal the dispatched
          # package_set_digest BEFORE any verdict. The release run's pack job (A1a,
          # #1877) certified this SAME digest; a mismatch means the staged set is not
          # the certified set, so the verdict must be FAIL. The same canonical form
          # is what scripts/ci/canary-verdict.sh re-derives at paste time.
          PKG_SET_DIGEST="${PKG_SET_DIGEST:-}"
          if ! printf '%s' "$PKG_SET_DIGEST" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::package_set_digest is not a 64-char hex sha256: '$PKG_SET_DIGEST'"
            exit 1
          fi
          COMPUTED_DIGEST="$(node scripts/ci/package-set-digest.mjs --version "$VERSION" < canary-logs/lockstep-sha256.txt)"
          if ! printf '%s' "$COMPUTED_DIGEST" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::could not re-derive the package-set digest from the verified tarballs (unmeasurable is FAIL)"
            exit 1
          fi
          if [ "$COMPUTED_DIGEST" != "$PKG_SET_DIGEST" ]; then
            echo "::error::package-set digest $COMPUTED_DIGEST (re-derived here) differs from the dispatched $PKG_SET_DIGEST — the staged set is not the release run's certified set; do not promote"
            exit 1
          fi
          echo "package-set digest verified: $COMPUTED_DIGEST"

      - name: Install from the registry and run the four install-tree assertions
        id: install
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail
          mkdir -p canary-logs
          PREFIX="$RUNNER_TEMP/flair-canary-prefix"
          rm -rf "$PREFIX"
          set +e
          node scripts/check-global-install-lockfile.mjs --registry-version "$VERSION" --prefix "$PREFIX" > canary-logs/install.log 2>&1
          rc=$?
          set -e
          # Evidence is grep/tail only — never a raw dump.
          grep -nE "\[global-install\]|invalid or damaged lockfile|added [0-9]+ packages" canary-logs/install.log | tail -n 40 || true
          if [ "$rc" -eq 2 ]; then
            echo "::error::install check DID NOT RUN — unmeasurable is FAIL"
            tail -n 40 canary-logs/install.log
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::install check FAILED (flair#1683 class)"
            grep -nE "✗|FAILED [0-9]+ check" canary-logs/install.log || tail -n 60 canary-logs/install.log
            exit 1
          fi
          echo "PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "install-tree assertions PASSED"

      - name: Boot the installed instance on the product path
        id: boot
        run: |
          set -uo pipefail
          mkdir -p canary-logs
          set +e
          FLAIR_BIN="$PREFIX/bin/flair" FLAIR_PREFIX="$PREFIX" \
            LOG_DIR="$PWD/canary-logs/instance-boot" \
            scripts/ci/check-instance-boot.sh > canary-logs/boot.log 2>&1
          rc=$?
          set -e
          # Evidence is grep/tail only — never a raw dump (the log can carry
          # provider URLs and paths; the password is never echoed).
          # flair#1782: ALSO surface doctor's FINDING lines (✗ / ⚠ / "issues
          # found") — the reason a `doctor --fix` or `doctor` exited non-zero
          # lives in the doctor logs, not boot.log, so grep them too. Keep the
          # existing patterns. The full logs are uploaded as an artifact below.
          grep -nE "^===|exit|supervised pid|descriptors present|PASS:|DID NOT RUN|::error|✗|⚠|issues? found" \
            canary-logs/boot.log \
            canary-logs/instance-boot/doctor-fix.log \
            canary-logs/instance-boot/doctor.log \
            | tail -n 60 || true
          if [ "$rc" -eq 2 ]; then
            echo "::error::boot check DID NOT RUN — unmeasurable is FAIL"
            tail -n 40 canary-logs/boot.log
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::boot check FAILED"
            tail -n 60 canary-logs/boot.log
            exit 1
          fi
          echo "boot contract PASSED"

      - name: Plugin canary — published adapters, documented host wiring, tool-call
        id: plugin
        # Run after a failed boot so the step can emit its own distinct line
        # instead of being skipped (a skip looks like a second unexplained red
        # at verdict time). Cancelled jobs do not run.
        if: success() || failure()
        env:
          VERSION: ${{ inputs.version }}
          BOOT_OUTCOME: ${{ steps.boot.outcome }}
        run: |
          set -uo pipefail
          mkdir -p canary-logs
          # Condition (3): boot already failed (or never ran). Do not restart,
          # install adapters, or produce a second "host unreachable" red.
          # The distinct line is the plugin step's FAIL.
          if [ "$BOOT_OUTCOME" != "success" ]; then
            set +e
            node scripts/ci/check-plugin-canary.mjs --boot-outcome "$BOOT_OUTCOME" \
              > canary-logs/plugin.log 2>&1
            set -e
            grep -nE "boot failed|DID NOT RUN" canary-logs/plugin.log || true
            echo "::error::boot failed → plugin unmeasurable"
            exit 1
          fi
          # Boot's contract includes a clean stop. Restart the already-inited
          # instance so the adapters have a live host. Failure to start is
          # unmeasurable — FAIL, never a skip.
          cleanup() {
            "$PREFIX/bin/flair" stop --port 19926 > canary-logs/plugin-stop.log 2>&1 || true
          }
          trap cleanup EXIT
          set +e
          "$PREFIX/bin/flair" start --port 19926 > canary-logs/plugin-start.log 2>&1
          start_rc=$?
          set -e
          if [ "$start_rc" -ne 0 ]; then
            echo "::error::plugin canary DID NOT RUN — could not restart the canary instance (unmeasurable is FAIL)"
            tail -n 40 canary-logs/plugin-start.log || true
            exit 1
          fi
          set +e
          node scripts/ci/check-plugin-canary.mjs \
            --version "$VERSION" \
            --boot-outcome "$BOOT_OUTCOME" \
            --flair-url "http://127.0.0.1:19926" \
            --agent canary \
            --key-path "$HOME/.flair/keys/canary.key" \
            --flair-bin "$PREFIX/bin/flair" \
            > canary-logs/plugin.log 2>&1
          rc=$?
          set -e
          grep -nE "\[plugin-canary\]|DID NOT RUN|FAIL:|PASS —" canary-logs/plugin.log | tail -n 40 || true
          if [ "$rc" -eq 2 ]; then
            echo "::error::plugin canary DID NOT RUN — unmeasurable is FAIL"
            tail -n 40 canary-logs/plugin.log
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::plugin canary FAILED"
            tail -n 60 canary-logs/plugin.log
            exit 1
          fi
          echo "plugin canary PASSED"

      - name: Lockstep `latest` skew (pre-promote)
        # flair#1781: before the verdict, surface whether the lockstep set is
        # ALREADY skewed on `latest` (a prior partial promote, or the older
        # single-package flow). The all-or-none promote block below is what
        # converges the set, so a pre-existing skew is reported, not blocked;
        # an unmeasurable check is named too, never silently green.
        id: skew
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail
          mkdir -p canary-logs
          set +e
          node scripts/ci/registry-latest-skew.mjs > canary-logs/skew.txt 2>&1
          rc=$?
          set -e
          cat canary-logs/skew.txt || true
          {
            echo ""
            echo "#### Lockstep \`latest\` skew (pre-promote)"
            echo '```'
            cat canary-logs/skew.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$rc" -eq 1 ]; then
            echo "::warning::lockstep \`latest\` is already skewed (see above) — the promote block below converges the set"
          elif [ "$rc" -eq 2 ]; then
            echo "::warning::lockstep skew check DID NOT RUN — could not read every dist-tags.latest"
          fi
          exit 0

      - name: Canary verdict — emit the promote or deprecate command
        # Runs whether or not the checks passed; the job itself still fails on a
        # red step (no continue-on-error anywhere). This step exists so the
        # PASS/FAIL line — with the sha256-bound promote command, or the
        # deprecate command — is the last thing both the log and the run summary
        # show.
        if: always()
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED: ${{ inputs.expected_sha256 }}
          SHA_OUTCOME: ${{ steps.sha.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BOOT_OUTCOME: ${{ steps.boot.outcome }}
          PLUGIN_OUTCOME: ${{ steps.plugin.outcome }}
          OS_NAME: ${{ matrix.os }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
             # F0 (A1c of #1671): the package-set digest is a workflow_dispatch input,
             # carried as an env var (never interpolated unquoted into the run: shell), so
             # a malformed or garbage value cannot inject metacharacters into the promoted
             # command; the 64-hex guard in the run block also refuses it before it reaches
             # canary-verdict.sh.
          PACKAGE_SET_DIGEST: ${{ inputs.package_set_digest }}
        run: |
          set -euo pipefail
          mkdir -p canary-logs
             # F0 (A1c of #1671): refuse early unless the package-set digest input is
             # 64 lowercase hex. Carried to canary-verdict.sh as "$PACKAGE_SET_DIGEST"
             # (an env var, never an unquoted interpolation), naming the input on failure.
          if ! printf '%s' "$PACKAGE_SET_DIGEST" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::package-set-digest input is not a 64-char hex sha256: '$PACKAGE_SET_DIGEST' (refused at dispatch; name the digest)" >&2
            exit 1
          fi
             # The command text is defined once, in scripts/ci/canary-verdict.sh, so
             # the emitted promote/deprecate block is the same thing the fails-first
             # proof exercises. (A1c of #1671) PASS is bound to the package-set digest
             # the release run's pack job certified: the emitted preflight re-derives it
             # from the registry at paste time and refuses a mismatch before any tag moves.
          if [ "$SHA_OUTCOME" = "success" ] && [ "$INSTALL_OUTCOME" = "success" ] && [ "$BOOT_OUTCOME" = "success" ] && [ "$PLUGIN_OUTCOME" = "success" ]; then
            scripts/ci/canary-verdict.sh pass "$VERSION" "$RUN_URL" --os "$OS_NAME" --package-set-digest "$PACKAGE_SET_DIGEST" | tee canary-logs/verdict.txt
          else
            scripts/ci/canary-verdict.sh fail "$VERSION" "$RUN_URL" --os "$OS_NAME" | tee canary-logs/verdict.txt
          fi
          cat canary-logs/verdict.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload canary logs
        # flair#1782: the logs (boot, doctor, verdict, skew) are the EVIDENCE for
        # a non-zero exit — `gh run download` reported nothing before because
        # canary-logs/ was never uploaded. Upload on EVERY run, both OS legs.
        # Short retention: this repo is public.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-logs-${{ matrix.os }}-${{ inputs.version }}
          path: canary-logs/
          if-no-files-found: warn
          retention-days: 7
