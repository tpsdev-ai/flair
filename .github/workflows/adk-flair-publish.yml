name: adk-flair — PyPI publish (OIDC trusted publishing)

# Publish adk-flair to PyPI via OIDC trusted publishing.
# One v* tag starts npm staging and this PyPI workflow after the release PR merges.
# adk-flair-v* remains available for Python-only releases.
#
# Cut a release — checked, tag-absent fallback (docs/releasing.md):
#   git ls-remote --tags origin v0.59.0  # must print nothing
#   git tag v0.59.0 && git push origin v0.59.0
#
# One-time PyPI setup (pypi.org): add a Trusted Publisher pointing at
#   owner=tpsdev-ai, repo=flair, workflow=adk-flair-publish.yml
#   environment=adk-flair-publish
# Admin: add v* to the `adk-flair-publish` environment's deployment tag policy;
# keep adk-flair-v* and its required reviewer.

on:
  push:
    tags:
      - "v*"
      - "adk-flair-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Fallback: version to publish from the selected ref"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish adk-flair to PyPI
    needs: resolve
    runs-on: ubuntu-latest
    environment: adk-flair-publish
    concurrency:
      group: adk-flair-publish-${{ needs.resolve.outputs.version }}
      cancel-in-progress: false
    permissions:
      id-token: write   # mint the short-lived OIDC token for PyPI trusted publishing
      contents: read    # checkout
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit ${GITHUB_SHA} is not an ancestor of origin/main. Tag a merged release commit."
            exit 1
          fi
          echo "  ok ${GITHUB_SHA} is on main"

      - name: Verify pyproject.toml version matches the tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cd packages/adk-flair
          PV="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$PV" != "$VERSION" ]; then
            echo "::error::pyproject.toml version is $PV, expected $VERSION."
            exit 1
          fi
          echo "  ok adk-flair @ $PV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.15"

      - name: Install build tooling
        run: pip install build

      - name: Build wheel and sdist
        run: |
          cd packages/adk-flair
          python -m build

      - name: Publish to PyPI via OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: packages/adk-flair/dist
          skip-existing: true

      - name: Verify wheel and sdist on PyPI
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$RUNNER_TEMP/adk-flair-pypi.json"
          if ! curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --output "$RELEASE_JSON" "https://pypi.org/pypi/adk-flair/$VERSION/json"; then
            echo "::error::PyPI lookup failed for adk-flair $VERSION."
            exit 1
          fi
          python3 - "$RELEASE_JSON" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          dist = Path("packages/adk-flair/dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              sys.exit("::error::Expected one locally built wheel and one sdist.")
          try:
              release = json.loads(Path(sys.argv[1]).read_text())
              published = {file["filename"]: file["digests"]["sha256"] for file in release["urls"]}
          except (OSError, ValueError, KeyError, TypeError) as error:
              sys.exit(f"::error::Invalid PyPI file list: {error}")
          for artifact in wheels + sdists:
              if artifact.name not in published:
                  sys.exit(f"::error::Missing PyPI file: {artifact.name}")
              digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
              if published[artifact.name] != digest:
                  sys.exit(f"::error::SHA256 mismatch for PyPI file: {artifact.name}")
              print(f"Verified {artifact.name}: {digest}")
          PY

      - name: Summary
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          {
            echo "### 🐍 adk-flair v$VERSION published to PyPI"
            echo ""
            echo "Package: [adk-flair](https://pypi.org/project/adk-flair/$VERSION/)"
            echo "Install: \`pip install adk-flair==$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            case "$REF_NAME" in
              adk-flair-v*) VERSION="${REF_NAME#adk-flair-v}" ;;
              v*) VERSION="${REF_NAME#v}" ;;
              *) echo "::error::Unexpected release tag '$REF_NAME'."; exit 1 ;;
            esac
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION'. Expected semver (e.g. 0.1.0 or 0.1.0-rc.1)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"
