name: Socket Security

# Explicit least privilege: this placeholder job only prints a note. It reads
# nothing, but a top-level `contents: read` keeps it off the repository default
# and matches the read-only floor every workflow here declares.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]

# Socket.dev GitHub App handles PR analysis automatically when installed.
# This workflow is a placeholder that documents the integration.
# Install the Socket GitHub App at: https://socket.dev
# Once installed, Socket automatically comments on PRs with supply chain risk analysis.

# Cancel a pull request's superseded runs. A pull_request run cancels any
# active run in the same workflow and PR group; an older-head rerun can
# therefore cancel the current head (rerun the current head if that happens).
# A paths-filtered event that starts no run cannot cancel anything. Distinct
# non-PR runs use their run IDs as groups, so this concurrency block does not
# cancel or serialize push-to-main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  socket-note:
    name: Socket.dev Supply Chain
    runs-on: ubuntu-latest
    steps:
      - run: echo "Socket.dev GitHub App monitors PRs automatically when installed on this repo."
