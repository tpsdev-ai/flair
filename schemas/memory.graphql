type Memory @table(database: "flair") {
  id: ID @primaryKey
  agentId: String! @indexed
  content: String!
  contentHash: String @indexed
  trigger: String @indexed   # flair#1542: the "when to use" text for a skill-tagged row. Skill-tagged
                               # rows embed from `trigger` (the recall signal), NOT from `content` (the full
                               # procedure) — see resources/skill-write.ts's skillEmbedText. Nullable/additive:
                               # non-skill rows carry no trigger and embed from `content` exactly as before
                               # (clean-upgrade-path gate). @indexed so the later skill recall tools can filter
                               # by trigger without a full-corpus scan.
  visibility: String
  embedding: [Float] @indexed(type: "HNSW", M: 16)   # M:16 is Harper's own HNSW default
                               # (HierarchicalNavigableSmallWorld M default) — declaring it explicitly is a
                               # ZERO behavior / graph-quality change. Its ONLY effect is the recall-heal
                               # trigger (resources/migrations/graph-heal.ts): Harper persists each HNSW
                               # attribute's option descriptor and, on boot, structurally diffs it against
                               # the schema (databases.ts canonicalizeIndexOptions — sorts keys, coerces
                               # numeric strings, but does NOT inject defaults, so `{type:"HNSW"}` and
                               # `{type:"HNSW",M:16}` are DIFFERENT canonical keys). A store whose descriptor
                               # was persisted WITHOUT options (every pre-this-change install) therefore sees
                               # a structural diff on the first boot after upgrade → runIndexing clears the
                               # graph store and rebuilds it CLEANLY from the already-correct stored vectors
                               # (lastIndexedKey reset to undefined). This heals graphs left stale by Harper's
                               # incremental HNSW update after a bulk in-place re-embed (the July embedding-
                               # stamp re-embed corrupted prod's reverse edges; a fresh index of the SAME
                               # vectors finds the true neighbors, the incrementally-updated one didn't).
                               # NO re-embed — the stored vectors are untouched; only the graph is rebuilt.
                               # Fires once per instance (the descriptor is then persisted to match); brief
                               # vector-search 503 window during the rebuild (~seconds; BM25/direct keep
                               # serving). Do NOT remove the `M: 16` — reverting it removes the upgrade heal.
  embeddingModel: String @indexed  # ops-1l18: previously written (resources/Memory.ts stamps every
                               # write) but never DECLARED in this schema, so it was storable but not
                               # queryable — Harper's Table.search({conditions}) rejects a condition on
                               # an undeclared attribute ("X is not a defined attribute"), which the
                               # zero-touch migration runner's bounded detect()/countPending()/run()
                               # queries (resources/migrations/embedding-stamp.ts: `embeddingModel
                               # not_equal <current>`) need in order to stay O(1)-bounded rather than a
                               # full-corpus scan on every boot. Purely additive — existing rows already
                               # carry this value on disk; declaring it queryable changes nothing about
                               # what's written or how embeddings/prefixes behave (#689's gate untouched).
  tags: [String] @indexed
  durability: String @indexed
  source: String
  type: String                # flair#1940 A1'' item 1: declared from MEASURED data, not derived from the schema. A live
                               # store (3,963 Memory rows) really carries `type` on 62% of rows — the client filters
                               # on it and MemoryMaintenance archives `type === "session"`. Declaring it here is what
                               # lets the declared-only whitelist (resources/memory-declared-attributes.ts) KEEP it on a
                               # full-row write instead of stripping it. Nullable/additive — existing rows keep their
                               # value, rows without it stay without it.
  createdAt: String! @indexed
  updatedAt: String
  instanceToken: String @indexed  # flair#1940 A1-iv: a server-stamped row INCARNATION token (UUID). The named
                               # application create paths stamp a local `instanceToken`; existing legacy rows may have
                               # none. Memory's REST write paths remove client-supplied `instanceToken` and
                               # `provenance`. The named update paths retain a stored token when their existing-row read
                               # succeeds. The host-pointer join binds on it: a pointer is returned only when
                               # memoryId, authorId === agentId, instanceToken and "not archived" all hold, so a
                               # deleted-and-recreated id (which gets a NEW token) can never re-bind a stale pointer.
                               # Nullable/additive: existing rows read back null (clean-upgrade-path gate).
  expiresAt: String @indexed
  retrievalCount: Int          # Observable search-hit counter. Authoritative increments live on
                               # MemoryHitStat (resources/hit-tracking.ts, flair#1528); GET/search
                               # overlay that row so this field still reads as it always has.
                               # The Memory row itself is no longer rewritten per hit.
  lastRetrieved: String        # Overlay companion to retrievalCount — see MemoryHitStat.
  usageCount: Int              # flair#683: verified-USE signal, distinct from retrievalCount (a
                               # search HIT). Additive/nullable — absent reads as 0, existing rows
                               # unaffected. NEVER auto-incremented on search/retrieval; the ONLY
                               # writer is resources/usage-recording.ts's recordUsageContribution()
                               # — the shared ledger core behind BOTH usage surfaces: POST
                               # /RecordUsage (resources/RecordUsage.ts) and citation-on-write
                               # (resources/Memory.ts post()/put() → recordCitations(), which also
                               # validates each cited id against the writer's read scope,
                               # flair#775). It does a targeted get-then-put increment on this
                               # field alone (never through Memory.put() — see RecordUsage.ts's
                               # module doc for why: usage feedback writes to ANOTHER agent's
                               # memory, and Memory's ownership check would 403 every legit
                               # call). Drives usageBoost in resources/scoring.ts, which replaces
                               # retrievalBoost in compositeScore (retrievalCount was the
                               # contaminated "retrieval counted as usage" signal root-caused in
                               # flair#623).
  promotionStatus: String   # null | "pending" | "approved" | "rejected"
  promotedAt: String
  promotedBy: String        # authenticated agentId who approved
  archived: Boolean @indexed
  archivedAt: String
  archivedBy: String        # authenticated agentId who archived
  # Learning pipeline fields
  parentId: String          # link to related memory
  derivedFrom: [String]     # source memory IDs this was reflected from
  sessionId: String @indexed  # originating session
  lastReflected: String     # ISO timestamp of last reflection pass
  supersedes: String @indexed  # ID of memory this one replaces (version chain)
  subject: String @indexed     # entity this memory is about (person, service, project)
  summary: String              # agent-set multi-sentence dense compression (optional; ops-wkoh)
                               # 3-tier compression chain: subject (one-line) → summary (paragraph) → content (full)
  validFrom: String @indexed   # ISO timestamp — when this fact became true
  validTo: String @indexed     # ISO timestamp — when this fact stopped being true (null = still valid)
  _safetyFlags: [String]       # content safety flags from scanContent()
  provenance: String           # JSON blob (memory-provenance slice 1; claimed.client added by flair#718): { v, verified: { agentId, timestamp, receivedAt }, claimed?: { model, client } }
                               # Server-STAMPED (receivedAt is the server's receipt time, never client-writable — flair#1940 A4).
  # flair#1940 A1' — The Memory schema does not declare a pointer attribute.
  # Supported Memory writes store accepted pointers in `MemoryHostSource`
  # (below); the named non-admin reads use its gated join. Client and adapter
  # transport is outside this slice. The three write-body inputs (hostSource,
  # hostSourceScope, hostSourceVisibility) are consumed by Memory.post()/put()
  # and are never persisted here.
  originatorInstanceId: String @indexed  # federation-edge-hardening slice 1: WRITE-TIME instance identity, stamped server-side on every
                               # application write via resources/originator-instance.ts from resources/instance-identity.ts's localInstanceId()
                               # (Memory/Soul/Agent/Relationship post()/put()/patch(), Memory's _reindex re-PUT, the FeedMemories ingest, AgentSeed
                               # and the MCP/IdP principal provisioning). On CREATE the local id is stamped and any request-body value is
                               # ignored; on UPDATE the STORED value stands (a body value neither replaces nor clears it, and an update that
                               # omits the field leaves it). Nullable (existing rows read null = clean upgrade).
                               # NOT client-writable through a resource write. Distinct from the legacy _originatorInstanceId (Federation.ts's
                               # mergeRecord — stamped by the RECEIVER at merge time, forgeable/lossy); this field is stamped by the ORIGINATING
                               # instance itself and preserved (never re-stamped) as the record flows through sync merges. Federation and Harper's
                               # administrator ops API are EXCEPTIONS to the rule, not the field's only raw writers: the SIGNED federation merge
                               # (FederationSync.post, which accepts a signed HTTP body from a known, non-revoked peer; a record's own signature,
                               # when present, is verified against the pinned key of the record's envelope originator) and the administrator ops
                               # API (:9925, admin auth). @indexed for the
                               # later sync push-query filter (per-record signature verification and the classifier org-gate are separate slices).
  metadata: String             # JSON blob (flair#1332/#1202): ADK custom_metadata, store-and-return. CLIENT-WRITABLE
                               # (unlike provenance above, which is server-stamped) and OPAQUE TO THE SERVER by
                               # contract: stored verbatim, returned verbatim, never parsed server-side, never
                               # queryable (Harper cannot query into a JSON blob), and NO key inside this blob
                               # ever influences any server decision — visibility, read-scope, durability,
                               # expiry, federation, ranking, nothing. A blob carrying {"visibility":"shared"}
                               # leaves the record's ACTUAL visibility at its default (contract-tested in
                               # packages/adk-flair/tests/test_metadata_and_list.py). If a specific key ever
                               # needs to be filterable, promote THAT key to its own @indexed scalar column
                               # (the #1202-documented add-on pattern; `subject` below is the first example) —
                               # never parse this blob. Size/shape caps are enforced at the writing client
                               # (adk-flair: 64KB serialized, depth ≤ 16, ≤ 512 keys). Nullable/additive —
                               # existing rows read null, unchanged behavior (clean-upgrade-path gate).
  entities: [String] @indexed  # attention-plane vocabulary strings (flair#675). Added in v1 (not v2) per K&S
                               # verdict on FLAIR-ATTENTION-PLANE.md — gives the future attention query
                               # uniform index pushdown across Memory/WorkspaceState/OrgEvent instead of a
                               # partial one. Optional/derivable-on-write (no automatic tagging built here —
                               # that producer is a follow-up); additive/nullable, existing rows carry no
                               # entities, readers tolerate absent (same pattern as Presence.activityUpdatedAt).
                               # See docs/entity-vocabulary.md.
  skillSubjectId: String @indexed  # Nullable, server-owned skill subject.
}

# Explicit entity-to-entity relationships with temporal validity.
# Enables queries like "who was team lead in Q1?" or "what changed about X on date Y?"
# Inspired by knowledge graph triples with time-bounded validity windows.
#
# attention-plane vocabulary note (flair#675): Relationship gets NO `entities`
# field. `subject`/`object` already hold free-form entity-reference strings
# and are already @indexed — they're the vocabulary carrier for this table.
# (Today they're lowercased on write in resources/Relationship.ts's put() but
# not yet validated against resources/entity-vocab.ts — wiring that
# validation, so `subject`/`object` are enforced attention-plane vocabulary
# strings, is a follow-up, not this foundation slice.)
type Relationship @table(database: "flair") {
  id: ID @primaryKey
  agentId: String! @indexed        # who created this relationship
  subject: String! @indexed        # source entity (person, project, service)
  predicate: String! @indexed      # relationship type (manages, owns, depends_on, etc.)
  object: String! @indexed         # target entity
  validFrom: String @indexed       # when this relationship became true
  validTo: String @indexed         # when it ended (null = still active)
  confidence: Float                # 0.0–1.0, how certain (1.0 = explicitly stated)
  source: String                   # where this was learned (memory ID, conversation, etc.)
  createdAt: String! @indexed
  updatedAt: String
  originatorInstanceId: String @indexed  # federation-edge-hardening slice 1 — see Memory.originatorInstanceId's doc above
                                    # for the full contract (write-time stamp, nullable, preserved across sync merges).
                                    # Stamped server-side in resources/Relationship.ts's post() and put() via resources/originator-instance.ts
                                    # (create stamps the local id; update keeps the stored value; never client-writable).
  provenance: String                # JSON blob (relationship-write-path, folded K&S refinement; re-stamped on
                                    # the semantic PATCH path by flair#1960 r2): SAME shape as
                                    # Memory.provenance above — { v, verified: { agentId, timestamp, receivedAt },
                                    # claimed?: { createdAt, model, client } } — via the shared
                                    # resources/provenance.ts buildProvenance(), never a
                                    # Relationship-specific format. On a newly stamped local write, every
                                    # field under `verified` is server-derived (the resolved auth verdict
                                    # + one server clock read), never client-writable. Nullable by design — pre-existing rows read back
                                    # provenance = null, unchanged behavior (migration-equivalence gate, same
                                    # discipline as Memory.usageCount/flair#684). Stamped server-side in
                                    # resources/Relationship.ts's post() and put() (and re-stamped on a semantic patch());
                                    # never client-writable.
}

type Soul @table(database: "flair") {
  id: ID @primaryKey
  agentId: String! @indexed
  key: String! @indexed
  value: String!
  priority: String              # critical | high | standard | low (skill governance)
  metadata: String              # JSON blob (skill governance: source, version, hash, etc.)
  provenance: String            # Server-derived operator/internal source class and authenticated author.
  durability: String @indexed
  createdAt: String!
  updatedAt: String
  originatorInstanceId: String @indexed  # federation-edge-hardening slice 1 — see Memory.originatorInstanceId's doc above
                                    # for the full contract (write-time stamp, nullable, preserved across sync merges).
                                    # Stamped server-side in resources/Soul.ts's post()/put() via resources/originator-instance.ts
                                    # (create stamps the local id; update keeps the stored value; never client-writable).
}

type MemoryGrant @table(database: "flair") @export {
  id: ID @primaryKey
  ownerId: String!
  granteeId: String!
  scope: String!
  filter: String
  createdAt: String
}

# MemoryUsage — the dedup ledger for the usage-feedback signal (flair#683).
# One row per (agentId, memoryId) contribution: `id` is the deterministic
# composite key `${agentId}:${memoryId}`, so "has this agent already
# contributed to this memory's usageCount" is a single point-lookup, not a
# query. This is what makes the anti-gaming dedup rule ("each (agent, memory)
# pair contributes at most 1 to usageCount" — Sherlock) enforceable: the
# shared ledger core (resources/usage-recording.ts's recordUsageContribution(),
# reached via POST /RecordUsage and via citation-on-write's recordCitations())
# only bumps Memory.usageCount when a NEW row is created here; a repeat call
# from the same agent for the same memory is a no-op against a row that
# already exists. resources/MemoryUsage.ts guards this table's own HTTP
# surface (it is not the writer).
#
# `attribution` is OPAQUE — never parsed, never fed to an LLM, never rendered
# — a free-text "what used this" hint the caller supplies, sanitized
# (control-character-stripped, length-capped) and stored as-is for
# analytics/audit only. Never trust it as anything more than a label.
type MemoryUsage @table(database: "flair") {
  id: ID @primaryKey           # `${agentId}:${memoryId}` — the dedup key itself
  agentId: String! @indexed    # the contributing (verified) agent — never client-forgeable
  memoryId: String! @indexed   # the memory this contribution counted toward
  attribution: String          # opaque/sanitized free-text hint (optional)
  createdAt: String!
}

# MemoryHitStat — search hit-tracking ledger (flair#1528 remaining slice).
# SemanticSearch used to patchRecord the full Memory row per returned hit so
# retrievalCount/lastRetrieved stayed on the memory itself. That is a full-row
# Harper put (embeddings included), feeds BM25/HNSW, and loses increments when
# concurrent searches read-modify-write the same five hits (Dex: 310 vs 320).
#
# This table is the increment target: one small row per memory id, coalesced
# per-id so concurrent hits add rather than race. No @export — no REST surface.
# resources/hit-tracking.ts is the only writer. Readers that expose the
# historical Memory.retrievalCount / lastRetrieved contract overlay this row
# (Memory.get/search, AdminMemory detail, MemoryConsolidate). Existing Memory
# field values seed the first increment so a store that already had counts
# does not reset. Agents have no role grant; internal raw-table writes bypass
# the flair_agent role the same way usage-recording writes MemoryUsage.
type MemoryHitStat @table(database: "flair") {
  id: ID @primaryKey           # Memory.id
  retrievalCount: Int
  lastRetrieved: String
}

# MemoryHostSource — the host pointer, IN ITS OWN TABLE (flair#1940 slice 1 /
# A1', confirmed by Kern and Sherlock). The pointer is a host-object pointer —
# versioned JSON { v: 1, host, kind, id, url? } — The Memory schema does not
# declare a pointer attribute. Supported Memory writes store accepted pointers in
# `MemoryHostSource`; the named non-admin reads use its gated join. Client and
# adapter transport is outside this slice.
#
# Writes are NOT a REST surface for any caller: Memory.post()/put() write the row
# in the SAME transaction as the Memory row — a request's open transaction, or
# one created with transaction(ctx, cb) when an internal caller has no request
# context — so the row and its pointer commit together or not at all (real-
# Harper t1/t2: a failed pointer write leaves no row, and a failed PUT leaves
# the pre-existing row byte-identical). This resource refuses its OWN
# post()/put()/patch()/delete() for EVERY caller (r4-http), so no REST caller
# can plant a pointer; a superuser Harper operation against the table (an
# operator export, backup or reseed) is the operator path.
#
# Direct resource reads permit admin agents and trusted in-process callers;
# non-admin agents cannot read this table directly. The author
# reads their own pointer only through the gated join INTO Memory results (A1'
# item 4), never from this table directly. Bootstrap does not render pointers in
# this slice.
#
# NOT federated (A1' item 5/A1'' item 8): the table is absent from
# FEDERATION_TABLE_POLICY, so it is never in the sync's table set, an inbound row
# carrying a pointer field is REFUSED (resources/federation-classify.ts). The
# outbound reader projects declared Memory attributes. The inbound merge removes
# undeclared attributes except the named bookkeeping fields (f1-out/f1-in).
#
# Cascade (A1' item 6 / A1'' item 2): `Memory.delete` and maintenance expiry or
# age-based archival delete the pointer with their Memory operation. POST
# /MemoryPurge deletes a pointer only after a read after its row delete's commit
# finds the row gone, so a row still stored keeps its pointer. `MemoryArchive`
# basement/restore retains the pointer row; the join suppresses it while the Memory
# is archived. `Memory.delete` joins a request transaction when present; maintenance
# uses an owned transaction per item (c3). An orphan sweep re-checks inside the
# transaction before deleting; a cleanup failure makes the maintenance run report a
# failure, not "complete".
#
# hostSource is a writer claim attributed to the authenticated agent on agent
# writes — a claimed external source. Flair does not verify the host object and
# does not cryptographically sign the pointer body (the Ed25519 request
# signature covers method and URL, not the body).
# scopeAtWrite is the record's visibility AT WRITE (null → author-only). The join
# takes the narrower of the stored pointer scope and the Memory row's current
# visibility. A partial PUT carries the stored visibility it read at the start of
# the request (p2). receivedAt is server-stamped.
type MemoryHostSource @table(database: "flair") @export {
  memoryId: ID @primaryKey      # the Memory.id this pointer belongs to
  hostSource: String!           # canonical v1 JSON: { v:1, host, kind, id, url? }
  scopeAtWrite: String          # the record's visibility at write when the write opted in; null = author-only
  authorId: String! @indexed    # server-stamped from the authenticated principal, NEVER the body
  memoryInstanceToken: String   # the Memory row's server-stamped `instanceToken` at pointer-write time (A1-iv). The
                               # join returns this pointer only when it still equals the Memory row's token, so a
                               # deleted-and-recreated id (new token) never re-binds it.
  receivedAt: String!           # server receipt time
}

# MemoryCandidate — staged distillations from the FLAIR-NIGHTLY-REM cycle.
# Per docs/rem.md. Slice 1 of ops-2qq adds the schema +
# `flair rem candidates` listing command. Future slices wire the nightly
# cycle that populates this table and the promote/reject endpoints.
#
# Inviolable contract: candidates are NEVER auto-promoted. Promotion is a
# separate, deliberate action (`flair rem promote <id> --rationale "<why>"`)
# that requires both --rationale and --to (soul|memory). Rejected candidates
# retain their decision history so recurring false-positives become visible
# via the `supersedes` chain.
#
# flair#849: this type shipped WITHOUT @export, so it had no REST surface at
# all — `flair rem candidates`/`promote`/`reject` 404'd on every call, a
# clean-room dogfood blocker. @export alone would have reopened the exact P0
# leak the memory-soul-read-gate family fix closed for every other
# agent-facing table (anonymous read/write of every row); see
# resources/MemoryCandidate.ts for the paired identity-gated, owner-scoped
# resource class that makes @export here safe.
type MemoryCandidate @table(database: "flair") @export {
  id: ID @primaryKey
  agentId: String! @indexed
  claim: String!                   # distilled lesson text
  sourceMemoryIds: [String]        # episodic memories feeding the distillation
  rationalePrompt: String          # the prompt given to the distillation LLM
  generatedBy: String              # model identifier (e.g. "claude-opus-4-7")
  generatedAt: String! @indexed
  status: String! @indexed         # pending | promoted | rejected
  target: String                   # soul | memory (set on promote)
  reviewerId: String               # who decided (agentId or human admin)
  reviewRationale: String          # required on promote/reject (no rubber-stamp)
  decidedAt: String
  supersedes: String @indexed      # previous rejected candidate this replaces
  scopeTag: String                 # #1205b-1: the authoritative scope:"tagged" tag this candidate was
                                   # distilled under (e.g. adk:<app>:<user>). Stamped at distillation time by
                                   # resources/MemoryReflect.ts when scope="tagged", so promotion can consume
                                   # the per-user scope tag DIRECTLY (src/cli.ts derivePromotedTags' stamped-tag
                                   # override) instead of re-reading source memories — closing the #1205a seam
                                   # where an ADK-sourced candidate with all-unreadable sources yields no adk:
                                   # evidence and would promote tagless (a cross-user leak). Nullable/additive —
                                   # pre-#1205b candidates and non-tagged (scope:"recent"/"all") distillations
                                   # read null, unchanged behavior (clean-upgrade-path gate).
  visibilityRuling: String         # flair#1257 slice 3: the distiller's AFFIRMATIVE visibility ruling for the
                                   # promoted row — only ever "shared", and only stamped (resources/memory-
                                   # reflect-lib.ts buildStagedCandidateRow) when the ruling arrived WITH a
                                   # non-empty team-relevance justification. Promotion (resources/auto-promote-
                                   # lib.ts decidePromotedVisibility) re-verifies all three conditions
                                   # (continuity scopeTag + this ruling + visibilityRationale) and defaults
                                   # "private" otherwise — default-private-unless (Sherlock): a shared promoted
                                   # row must always trace to a recorded justification, never to a default.
                                   # Nullable/additive — pre-slice-3 candidates read null ⇒ private, unchanged.
  visibilityRationale: String      # flair#1257 slice 3: the team-relevance justification paired with
                                   # visibilityRuling — the auditable "why shared" recorded on the candidate.
                                   # Nullable/additive, same clean-upgrade contract as scopeTag above.
}

# Asset — binary blobs (screenshots, images) stored out-of-record via Harper's
# Blob type, referenced from a Memory by `memoryId`. Slice 1: storage only
# (no MCP exposure). owner-only + identity-gated + federation "excluded" per
# resources/record-types.ts (RECORD_TYPES.Asset) — a new type must not enter
# federation sync (Federation.ts's table list is unchanged).
# Lifecycle: retained until the owner deletes the Asset row. Deleting the
# parent Memory does not sweep linked blobs (no GC this slice). Slice 2
# serving 404s dangling refs; GC + memoryId exist-and-owned check deferred.
# updatedAt is nullable/additive so a later sweep can key on recency.
type Asset @table(database: "flair") @export {
  id: ID @primaryKey
  agentId: String! @indexed        # owner (no-forge attribution / read scope)
  memoryId: String @indexed        # the Memory record this asset belongs to
  contentType: String              # MIME type, e.g. image/jpeg
  data: Blob                       # binary content, stored out-of-record
  createdAt: String! @indexed
  updatedAt: String                # stamped on write; later sweep key (nullable/additive)
}

# OrgSkillAssignment — an org-scope skill assignment (flair#2141 S1):
# `skillRef`, under `skillName` and `priority`, for the agents on this
# instance that receive org skills (resources/skill-manifest.ts). No @export:
# the REST surface is resources/OrgSkillAssignment.ts, whose writes need the
# operator or internal source and server-stamp `writer`, `sourceClass`,
# `createdAt` and `updatedAt`. Instance-local: absent from the federation table
# policy.
type OrgSkillAssignment @table(database: "flair") {
  id: ID @primaryKey
  skillName: String! @indexed
  skillRef: String!
  priority: String!                # critical | high | standard | low
  createdAt: String!
  updatedAt: String
  writer: String                   # the operator's principal id; null for an internal write
  sourceClass: String!             # operator | internal
}

# Deletion history for physical deletions of permanent/persistent Memory rows,
# appended in the delete's transaction by Memory.delete and by POST /MemoryPurge
# (the path CLI hygiene and agent remove use). For a row still stored after the
# commit, MemoryPurge attempts history cleanup and checks for absence after its
# commit; unconfirmed cleanup returns 500 memory_purge_history_cleanup_unconfirmed.
# Non-durable deletes, including maintenance expiry, append no history.
# No @export and no resource class: there is no direct route.
type MemoryDeletionHistory @table(database: "flair") {
  id: ID @primaryKey               # unique per deletion record (a memory id can be deleted and re-created)
  memoryId: String! @indexed
  memoryInstanceToken: String
  durability: String               # the deleted row's durability at deletion, when known
  actor: String                    # the deleting principal; null when no actor is supplied
  sourceClass: String!             # agent | admin | internal
  at: String! @indexed             # ISO timestamp of the delete
}

# OrgSkillAssignmentHistory — one row per accepted write through
# resources/OrgSkillAssignment.ts, appended in the write's transaction.
# No @export and no resource class: there is no direct /OrgSkillAssignmentHistory route.
type OrgSkillAssignmentHistory @table(database: "flair") {
  id: ID @primaryKey
  assignmentId: String! @indexed
  op: String!                      # create | update | delete
  actor: String                    # the writer; null for an internal write
  sourceClass: String!             # operator | internal
  previousHash: String             # sha256 of the stored row before the write; null on create
  at: String!
}

# InstructionVersion — single-row Soul and skill write history; Soul collection deletes are refused.
# REST mutation verbs are refused; reads authorize soul and skill subjects.
# The administrator operations API is an unaudited exception.
type InstructionVersion @table(database: "flair") @export {
  id: ID @primaryKey              # encodes subjectType + subjectId + version
  subjectType: String! @indexed   # soul | skill
  subjectId: String! @indexed     # canonical subject (soul: agentId:key)
  agentId: String! @indexed       # owner
  key: String                     # Soul key
  version: BigInt!                # positive per-subject sequence
  kind: String!                   # create | update | delete
  rowId: ID!                      # affected physical row
  valueHash: String               # sha256 of the value bytes; null on delete
  previousVersionHash: String     # preceding record digest; null on the first record
  recordHash: String!             # record digest over every other field
  soulSnapshot: String            # serialized Soul state including its value
  memoryId: ID                    # skill-version Memory reference
  visibility: String              # retained skill read-scope metadata
  actorKind: String!              # operator | agent | internal | instance
  actorId: String                 # verified identity; null for unattributed internal calls
  sourceClass: String!            # operator | internal | agent | federation | seed
  createdAt: String!              # server ISO timestamp
  guarded: Boolean!               # whether expectedVersion was compared
  expectedVersion: ID             # the compared head; null on an unguarded write
}
