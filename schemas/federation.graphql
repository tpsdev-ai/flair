# Federation tables — hub-and-spoke sync per FLAIR-FEDERATION spec.

# Instance identity — one record per Flair instance.
type Instance @table(database: "flair") @export {
  id: ID @primaryKey               # "flair_h82kx9" — generated on first boot
  publicKey: String!               # Ed25519 instance key (base64url)
  role: String @indexed            # "hub" | "spoke"
  fabricEndpoint: String           # wss:// URL if hub
  status: String @indexed          # "active" | "paused" | "decommissioned"
  lastSeen: String
  createdAt: String! @indexed
  updatedAt: String
}

# One-time pairing tokens — generated by hub admin, consumed during peer pairing.
type PairingToken @table(database: "flair") @export {
  id: ID @primaryKey               # the token value (crypto random)
  createdBy: String                # admin who generated it
  consumedBy: String               # peer instanceId that used it
  consumedAt: String               # when it was consumed
  expiresAt: String! @indexed      # token TTL (default 1 hour)
  createdAt: String! @indexed
}

# Peer records — known federation peers.
# Hub has one entry per spoke. Spokes have one entry for the hub.
type Peer @table(database: "flair") @export {
  id: ID @primaryKey               # peer's instance ID
  publicKey: String!               # peer's Ed25519 public key (pinned on first pair)
  role: String @indexed            # "hub" | "spoke"
  endpoint: String                 # wss:// URL for the peer
  status: String @indexed          # "paired" | "connected" | "disconnected" | "revoked"
  lastSyncAt: String               # last contact with this peer (liveness signal)
  lastMergeAt: String              # last sync where merged > 0 (data-progress signal)
  lastSyncCursor: String           # Lamport clock or ISO timestamp for incremental sync
  relayOnly: Boolean               # true for spoke-to-spoke peers announced by hub
  pairedAt: String
  createdAt: String! @indexed
  updatedAt: String
}

# Sender-owned federation retry obligations (flair#2455). The table is shaped
# for one row per (peer, table, record) the receiver refused for a reason a
# later re-offer could clear, plus locally observed unconfirmed sends. Nothing
# writes a row yet: the sender creates them once it is activated in a later
# slice. Local bookkeeping, EXCLUDED from federation policy and the receive
# mapping, so an inbound sync cannot target it (a pushed record naming it skips
# as `unknown_table`).
#
# `id` is the collision-free encoding of the (peerId, table, recordId) tuple
# (resources/federation-retry-lib.ts retryEntryKey); the three components are
# also stored whole for querying. @sealed: Harper refuses any write carrying a
# field not declared below, so no record content can be stored here; a re-offer
# will read the source row fresh. Admin-only on every operation; see
# resources/FederationRetry.ts.
type FederationRetry @table(database: "flair") @sealed @export {
  id: ID @primaryKey               # retryEntryKey(peerId, table, recordId)
  peerId: String! @indexed         # the peer that refused (or never answered)
  table: String!                   # the source table name
  recordId: String!                # the source row id
  state: String! @indexed          # "pending" | "terminal"
  firstRefusedAt: String! @indexed # age is measured from here (the T bound)
  attempts: Int! @indexed          # reserved and persisted before each send (the N bound)
  episodeId: String                # RESERVED for sender activation (flair#2455 slice 3): the obligation's generation, for rejecting stale completions; nothing sets or checks it yet
  recordFingerprint: String        # content fingerprint, for exhausted-row suppression
  lastReason: String               # the closed SkipReason, or a local reason
  lastAttemptSyncId: String        # the sync that last reserved an attempt
  lastAttemptAt: String
  completedAt: String              # when the row became terminal
  resolution: String               # which terminal outcome ended it
  bound: String                    # "attempts" | "age" | "both" for retry_exhausted; null otherwise
  createdAt: String!
  updatedAt: String
}


# Federation body-signature nonces are recorded in `ReplayNonce`
# (schemas/replay.graphql), shared with agent auth (flair#2061).

# Sync log — audit trail for federation operations.
type SyncLog @table(database: "flair") {
  id: ID @primaryKey
  peerId: String! @indexed         # which peer this sync was with
  direction: String! @indexed      # "push" | "pull"
  recordCount: Int                 # how many records merged in this batch
  skippedCount: Int                # how many records skipped (sum of skippedReasons)
  skippedReasons: String           # JSON: { unknown_table: N, non_originator: N, future_timestamp: N, no_op_same_hash: N, merge_error: N, invalid_agent_id: N, skill_not_federated: N, seed_id_not_federated: N, content_suffix_id_not_federated: N, unknown_originator_key: N, invalid_signature: N, missing_signature: N, principal_mismatch: N }
  status: String @indexed          # "success" | "partial" | "failed"
  error: String                    # human-readable summary if partial/failed (includes per-record error messages, capped)
  durationMs: Int                  # how long the sync took
  createdAt: String! @indexed
}
